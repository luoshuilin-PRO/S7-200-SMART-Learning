<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600"><rect width="1000" height="600" fill="white"/><g font-family="sans-serif" fill="#162b4d"><text x="30" y="42" font-size="26">SMART-005 按钮与旋钮触点逻辑（教学简图）</text><text x="55" y="105" font-size="21">NO 13–14：常开</text><text x="535" y="105" font-size="21">NC 11–12：常闭</text></g><g stroke="#172b4d" stroke-width="4" fill="none"><path d="M60 175 H200 M250 175 H420 M200 175 L247 140 M540 175 H680 M730 175 H910 M680 145 L730 175 M60 345 H420 M540 345 H910"/><circle cx="200" cy="175" r="5" fill="#172b4d"/><circle cx="250" cy="175" r="5" fill="#172b4d"/><circle cx="680" cy="175" r="5" fill="#172b4d"/><circle cx="730" cy="175" r="5" fill="#172b4d"/></g><g font-family="sans-serif" fill="#172b4d" font-size="19"><text x="60" y="235">瞬时自复位：按下NO闭合，松开断开</text><text x="540" y="235">瞬时自复位：按下NC断开，松开闭合</text><text x="60" y="315">机械保持按钮：动作后状态持续，解锁才恢复</text><text x="540" y="315">急停：锁定+人工复位；复位不应直接启动</text><text x="60" y="410">两位旋钮：0 / 1，保持或弹簧复位依型号</text><text x="540" y="410">三位旋钮：左 / 中 / 右，可混合复位</text><text x="60" y="475">触点符号表达电气状态；保持/复位特性须另注机械操作方式。</text><text x="60" y="525">示例端子号仅供识读，工程使用需核对厂家触点模块。</text></g></svg>