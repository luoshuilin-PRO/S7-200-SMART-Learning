<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820"><rect width="1280" height="820" fill="white"/><g font-family="Arial,Microsoft YaHei,sans-serif" fill="#17334a"><text x="45" y="53" font-size="30" font-weight="bold">SMART-018 漏电保护：RCCB与RCBO功能对照</text><text x="45" y="86" font-size="17">SMART学习资料 | 原理示意 / 触点按未动作状态 | 不作为现场施工图</text></g><g stroke="#173b58" stroke-width="3" fill="none" stroke-linecap="round"><text x="70" y="165" stroke="none" fill="#17334a" font-size="20" font-family="Arial,Microsoft YaHei,sans-serif">A. RCCB（仅剩余电流保护）</text><text x="665" y="165" stroke="none" fill="#17334a" font-size="20" font-family="Arial,Microsoft YaHei,sans-serif">B. RCBO（剩余电流 + 过电流保护）</text>
<path d="M130 190 L130 300"/><path d="M130 435 L130 570"/><path d="M290 190 L290 300"/><path d="M290 435 L290 570"/><path d="M730 190 L730 300"/><path d="M730 435 L730 570"/><path d="M890 190 L890 300"/><path d="M890 435 L890 570"/>
<rect x="90" y="300" width="250" height="135"/><text x="102" y="335" stroke="none" fill="#17334a" font-size="20" font-family="Arial,Microsoft YaHei,sans-serif">QF1  RCCB</text><rect x="690" y="300" width="250" height="135"/><text x="702" y="335" stroke="none" fill="#17334a" font-size="20" font-family="Arial,Microsoft YaHei,sans-serif">QF2  RCBO</text>
<text x="120" y="350" stroke="none" fill="#17334a" font-size="20" font-family="Arial,Microsoft YaHei,sans-serif">L</text><text x="280" y="350" stroke="none" fill="#17334a" font-size="20" font-family="Arial,Microsoft YaHei,sans-serif">N</text><text x="720" y="350" stroke="none" fill="#17334a" font-size="20" font-family="Arial,Microsoft YaHei,sans-serif">L</text><text x="880" y="350" stroke="none" fill="#17334a" font-size="20" font-family="Arial,Microsoft YaHei,sans-serif">N</text>
<text x="70" y="622" stroke="none" fill="#17334a" font-size="20" font-family="Arial,Microsoft YaHei,sans-serif">RCCB上游必须有适当的过电流保护。</text><text x="665" y="622" stroke="none" fill="#17334a" font-size="20" font-family="Arial,Microsoft YaHei,sans-serif">RCBO具有两类保护，参数仍需匹配负载。</text>
<text x="70" y="693" stroke="none" fill="#17334a" font-size="20" font-family="Arial,Microsoft YaHei,sans-serif">正常时L与N电流矢量和≈0；发生对地泄漏可能产生剩余电流并触发动作。</text>
<text x="70" y="728" stroke="none" fill="#17334a" font-size="20" font-family="Arial,Microsoft YaHei,sans-serif">N按产品规定穿过检测回路；PE不穿过RCD检测回路；严禁借用或混接负载侧N。</text></g><text x="45" y="786" font-family="Arial,Microsoft YaHei,sans-serif" font-size="17" fill="#17334a">实际施工须核对产品端子图、保护协调、导线截面、PE接地与适用标准；未进行实机验证。</text></svg>