<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570"><rect width="1100" height="570" fill="white"/><g font-family="sans-serif" fill="#182c4b"><text x="30" y="45" font-size="27">SMART-009 三线光电传感器：PNP与NPN</text><text x="50" y="110" font-size="23">PNP 源型输出</text><text x="590" y="110" font-size="23">NPN 漏型输出</text><text x="50" y="170" font-size="20">棕线 → +24V</text><text x="50" y="220" font-size="20">蓝线 → 0V</text><text x="50" y="270" font-size="20">黑线 → 负载 → 0V</text><text x="590" y="170" font-size="20">棕线 → +24V</text><text x="590" y="220" font-size="20">蓝线 → 0V</text><text x="590" y="270" font-size="20">+24V → 负载 → 黑线</text><text x="50" y="355" font-size="20">动作时：黑线输出接近+24V</text><text x="590" y="355" font-size="20">动作时：黑线拉向0V</text><text x="50" y="445" font-size="19">PLC输入公共端必须匹配输入电路类型，不可直接照搬两种接法。</text><text x="50" y="500" font-size="18">传感器输出额定电流、漏电流、NO/NC与亮通/暗通请查具体手册。</text></g></svg>