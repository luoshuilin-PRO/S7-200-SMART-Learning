<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940">
<rect width="1400" height="940" fill="#fff"/>
<style>text{font-family:Arial,"Microsoft YaHei",sans-serif;fill:#193b52} .wire{stroke:#193b52;stroke-width:3;fill:none;stroke-linecap:square} .power{stroke:#ae5147;stroke-width:3;fill:none} .node{fill:#193b52} .head{font-size:28;font-weight:bold}.label{font-size:19}.small{font-size:16}</style>
<text x="50" y="52" class="head">SMART-020 | QF1 + KM1 + FR1 三相电机起保停控制（含完整自锁支路）</text>
<text x="50" y="83" class="small">24V DC控制电源示例；所有触点按断电、未按按钮、热继电器未跳闸状态绘制。教学原理图，非施工图。</text>
<line x1="660" y1="122" x2="660" y2="815" stroke="#d1dce4" stroke-width="2"/>
<text x="80" y="135" class="head">一、动力回路</text>
<text x="750" y="135" class="head">二、控制回路：自锁 / 停止 / 过载跳闸</text>
<g class="wire">
<!-- Power: 3 distinct conductors and three poles -->
<path d="M145 195 V260 M285 195 V260 M425 195 V260"/>
<path d="M145 305 V385 M285 305 V385 M425 305 V385"/>
<path d="M145 425 V505 M285 425 V505 M425 425 V505"/>
<path d="M145 565 V670 M285 565 V670 M425 565 V670"/>
<!-- QF poles -->
<rect x="125" y="260" width="40" height="45"/><rect x="265" y="260" width="40" height="45"/><rect x="405" y="260" width="40" height="45"/>
<!-- KM three open main contacts -->
<path d="M145 385 V397 M145 416 V425 M131 414 L159 389 M285 385 V397 M285 416 V425 M271 414 L299 389 M425 385 V397 M425 416 V425 M411 414 L439 389"/>
<!-- FR 3 heating elements -->
<rect x="124" y="505" width="42" height="60"/><rect x="264" y="505" width="42" height="60"/><rect x="404" y="505" width="42" height="60"/>
<path d="M145 505 V515 M145 555 V565 M285 505 V515 M285 555 V565 M425 505 V515 M425 555 V565"/>
<!-- motor terminals and motor -->
<circle cx="145" cy="677" r="6"/><circle cx="285" cy="677" r="6"/><circle cx="425" cy="677" r="6"/>
<path d="M145 683 V704 H285 M425 683 V704 H285 M285 683 V704"/>
<circle cx="285" cy="751" r="46"/><path d="M285 704 V705"/>
<!-- Control supply rails and series stop and FR -->
<path d="M790 210 H910 V252 M910 299 V342 M910 389 V455"/>
<!-- parallel start and holding branch -->
<path d="M910 455 H910 V482 M910 455 H1130 V482"/>
<path d="M910 530 V590 H1020 M1130 530 V590 H1020"/>
<!-- to coil and return -->
<path d="M1020 590 V655"/>
<rect x="982" y="655" width="76" height="64"/>
<path d="M1020 719 V766 H910 V795 H790"/>
<!-- NC stop S0 (bridged in rest) -->
<path d="M910 252 V268 M910 285 V299 M895 268 L925 285 M896 261 L924 261"/>
<!-- NC FR -->
<path d="M910 342 V358 M910 375 V389 M895 358 L925 375 M896 351 L924 351"/>
<!-- NO S1 -->
<path d="M910 482 V494 M910 518 V530 M895 516 L925 495"/>
<!-- NO KM1 hold -->
<path d="M1130 482 V494 M1130 518 V530 M1115 516 L1145 495"/>
</g>
<g class="node"><circle cx="910" cy="455" r="5"/><circle cx="910" cy="590" r="5"/><circle cx="1130" cy="455" r="5"/><circle cx="1130" cy="590" r="5"/></g>
<g class="label">
<text x="132" y="180">L1</text><text x="272" y="180">L2</text><text x="412" y="180">L3</text>
<text x="465" y="291">QF1 三极断路器</text><text x="465" y="415">KM1 主触点</text><text x="465" y="543">FR1 热元件</text>
<text x="265" y="759">M1</text><text x="237" y="817">三相电动机</text>
<text x="775" y="200">+24V</text><text x="765" y="802">0V</text>
<text x="950" y="283">S0 停止 NC (11-12)</text><text x="950" y="375">FR1 NC (95-96)</text>
<text x="816" y="511">S1 启动 NO</text><text x="1085" y="563">KM1 NO (13-14)</text>
<text x="1067" y="691">KM1 线圈 A1/A2</text>
</g>
<g class="small">
<text x="80" y="862">PE保护接地必须连接电机外壳；图中未展开PE、端子排、上级保护和线圈抑制。</text>
<text x="750" y="852">自锁：按S1 → KM1得电 → 13-14闭合 → 松开S1仍保持。</text>
<text x="750" y="882">按S0或FR1跳闸 → 95-96/停止回路断开 → KM1失电。</text>
<text x="50" y="916">注：图为电气逻辑教学示意，器件型号、端子、过流保护配合及电机接线须按实际产品核验；未经实机测试。</text>
</g></svg>