<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><rect width="1100" height="620" fill="#fff"/><g font-family="Arial,'Noto Sans CJK SC',sans-serif" fill="#17324d"><text x="45" y="62" font-size="32">SMART-011 接近开关：PNP / NPN</text><text x="70" y="140" font-size="24">DC 24V（仅为示例，需核对型号）</text><text x="70" y="202" font-size="24">棕色 BN：+24V；蓝色 BU：0V；黑色 BK：输出</text><text x="70" y="264" font-size="24">PNP：BK → PLC兼容数字输入，动作时提供正电位</text><text x="70" y="326" font-size="24">NPN：BK → PLC兼容数字输入，动作时拉向0V</text><text x="70" y="388" font-size="24">NO / NC 是输出初始逻辑，不是PNP / NPN的同义词</text><text x="70" y="450" font-size="24">交流两线式：负载与传感器串联，须核对漏电流和最小负载</text><text x="70" y="578" font-size="19">教学功能示意｜接线须核对器件手册、PLC输出类型和保护要求</text></g></svg>