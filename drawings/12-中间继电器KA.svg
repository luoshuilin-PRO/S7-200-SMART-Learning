<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><rect width="1100" height="620" fill="#fff"/><g font-family="Arial,'Noto Sans CJK SC',sans-serif" fill="#17324d"><text x="45" y="62" font-size="32">SMART-012 中间继电器 KA1</text><text x="70" y="140" font-size="24">24V DC线圈：13 (−) ─ [ KA1 ] ─ 14 (+)（教材型号示例）</text><text x="70" y="202" font-size="24">线圈得电：NO闭合、NC断开；失电时恢复原位</text><text x="70" y="264" font-size="24">四组转换触点仅为教材器件配置，不代表所有KA</text><text x="70" y="326" font-size="24">KA1触点可控制HL1信号灯，须核对触点容量</text><text x="70" y="388" font-size="24">线圈抑制器件（续流二极管等）需按极性和驱动类型选配</text><text x="70" y="578" font-size="19">教学功能示意｜接线须核对器件手册、PLC输出类型和保护要求</text></g></svg>