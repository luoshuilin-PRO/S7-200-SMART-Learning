<svg xmlns="http://www.w3.org/2000/svg" width="980" height="500"><rect width="980" height="500" fill="white"/><g font-family="sans-serif" fill="#182c4b"><text x="30" y="45" font-size="27">SMART-008 行程开关SQ与左右限位</text><text x="55" y="110" font-size="23">SQ1 NO：未触发断开，触发闭合</text><text x="55" y="185" font-size="23">SQ2 NC：未触发闭合，触发断开</text><text x="55" y="280" font-size="22">24V+ → SQ1 NO → PLC I0.2（左限位）</text><text x="55" y="340" font-size="22">24V+ → SQ2 NO → PLC I0.3（右限位）</text><text x="55" y="400" font-size="18">仅示例适配的源型24V输入；公共端接法须核对CPU型号。</text><text x="55" y="445" font-size="18">运动停止逻辑与安全保护需分别设计；不可用普通输入代替安全回路。</text></g></svg>