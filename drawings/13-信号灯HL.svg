<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><rect width="1100" height="620" fill="#fff"/><g font-family="Arial,'Noto Sans CJK SC',sans-serif" fill="#17324d"><text x="45" y="62" font-size="32">SMART-013 信号灯 HL</text><text x="70" y="140" font-size="24">24V DC电源 + → 开关/适配PLC输出 → ( HL1 ) → 0V</text><text x="70" y="202" font-size="24">HL：指示灯图形符号通常为圆圈内交叉线</text><text x="70" y="264" font-size="24">红色：故障/危险；黄色：注意；绿色：正常/允许</text><text x="70" y="326" font-size="24">蓝色：指定操作；白色：中性/其他信息</text><text x="70" y="388" font-size="24">HL1、HL2等为设备编号，灯具额定电压必须匹配</text><text x="70" y="578" font-size="19">教学功能示意｜接线须核对器件手册、PLC输出类型和保护要求</text></g></svg>